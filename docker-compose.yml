services:
  postgres:
    image: postgres:15
    environment:
      # To avoid the following error:
      #
      #   Error: Database is uninitialized and superuser password is not
      #   specified.  You must specify POSTGRES_PASSWORD for the superuser. Use
      #   "-e POSTGRES_PASSWORD=password" to set it in "docker run".
      #
      #   You may also use POSTGRES_HOST_AUTH_METHOD=trust to allow all
      #   connections without a password. This is *not* recommended. See
      #   PostgreSQL documentation about "trust"
      POSTGRES_HOST_AUTH_METHOD: trust

  conjur:
    image: ${REGISTRY_URL:-docker.io}/cyberark/conjur:edge
    command: server -a conjur
    environment:
      DATABASE_URL: postgres://postgres@postgres/postgres
      CONJUR_DATA_KEY:
      RAILS_ENV: development
      # Enable dynamic secrets for the Issuers API
      CONJUR_FEATURE_DYNAMIC_SECRETS_ENABLED: true
    depends_on:
      - postgres

  test-1.27:
    build:
      context: .
      args:
        FROM_IMAGE: "golang:1.27"
    ports:
      - 8080
    depends_on:
      - conjur
    volumes:
      - ./output:/conjur-api-go/output
    environment:
      CONJUR_DATA_KEY:
      CONJUR_APPLIANCE_URL: http://conjur
      CONJUR_ACCOUNT: conjur
      CONJUR_AUTHN_LOGIN: admin
      CONJUR_AUTHN_API_KEY:
      GO_VERSION:
    # Joined to the 'conjur' network so the container can resolve
    # conjur-leader-1.mycompany.local when cert tests are active.
    # The 'default' network entry keeps connectivity to the OSS conjur service.
    networks:
      - default
      - conjur

  test-1.26:
    build:
      context: .
      args:
        FROM_IMAGE: "golang:1.26"
    ports:
      - 8080
    depends_on:
      - conjur
    volumes:
      - ./output:/conjur-api-go/output
    environment:
      CONJUR_DATA_KEY:
      CONJUR_APPLIANCE_URL: http://conjur
      CONJUR_ACCOUNT: conjur
      CONJUR_AUTHN_LOGIN: admin
      CONJUR_AUTHN_API_KEY:
      GO_VERSION:
    # See note on test-1.27 networks above.
    networks:
      - default
      - conjur

  dev:
    build:
      context: .
      args:
        FROM_IMAGE: "golang:1.26"
    ports:
      - 8080
    depends_on:
      - conjur
    volumes:
      - .:/conjur-api-go
    environment:
      CONJUR_DATA_KEY:
      CONJUR_APPLIANCE_URL: http://conjur
      CONJUR_ACCOUNT: conjur
      CONJUR_AUTHN_LOGIN: admin
      CONJUR_AUTHN_API_KEY:
    entrypoint: sleep
    command: infinity

  mock-jwt-server:
    image: cyberark/mock-jwt-server:latest
    ports:
      - 8080
    environment:
      ISSUER: "jwt-server"
      AUDIENCE: "conjur"
      SUBJECT: "test-workload"
      EMAIL: "workload@example.com"

  # Enterprise appliance — only started when the "cert" profile is active
  # (i.e. when TEST_CERT=true and setup-cert-auth.sh is invoked from test.sh).
  # The appliance image is self-contained (embedded postgres); no separate DB needed.
  #
  # registry.tld is the standard CyberArk private registry hostname. All developers
  # are expected to have it mapped in /etc/hosts (or local DNS).
  conjur-leader:
    image: registry.tld/conjur-appliance:${APPLIANCE_TAG:-5.0-stable}
    hostname: conjur-leader-1.mycompany.local
    restart: unless-stopped
    security_opt:
      # Enterprise appliance needs keyctl for its session keyring; Docker's default seccomp blocks it.
      # kics-scan ignore-line
      - seccomp:unconfined
      - no-new-privileges:true
    environment:
      CONJUR_LOG_LEVEL: debug
      CONJUR_HOSTNAME: conjur-leader-1.mycompany.local
      CONJUR_ACCOUNT: conjur
      # kics-scan ignore-line
      CONJUR_ADMIN_PASSWORD: ${CONJUR_ADMIN_PASSWORD:-MySecretP@ss1}
    networks:
      conjur:
        aliases:
          - conjur-leader-1.mycompany.local
    profiles:
      - cert

  # SPIRE server — only started when the "spiffe" profile is active
  # (i.e. when TEST_SPIFFE=true and setup-spiffe.sh is invoked from test.sh).
  spire-server:
    image: ghcr.io/spiffe/spire-server:${SPIRE_VERSION:-1.15.2}
    hostname: spire-server
    command: ["-config", "/etc/spire/server/server.conf"]
    volumes:
      - ./bin/spire/server:/etc/spire/server:ro
    networks:
      - spiffe
    profiles:
      - spiffe

  # SPIRE agent — only started when the "spiffe" profile is active.
  # The agent image is distroless (only /opt/spire/bin/spire-agent; no shell).
  # setup-spiffe.sh generates a join token and exports SPIRE_JOIN_TOKEN before
  # calling 'docker compose up', so Compose substitutes it into the entrypoint.
  #
  # pid: host is required for the unix WorkloadAttestor. The agent identifies
  # workloads by reading /proc/<pid>/status via the PID returned by SO_PEERCRED.
  # When the test container and the agent container have separate PID namespaces
  # (the Docker default), the agent's /proc does not contain the test process,
  # and workload attestation fails immediately. Sharing the host PID namespace
  # gives the agent a /proc view that includes all containers on the node.
  spire-agent:
    image: ghcr.io/spiffe/spire-agent:${SPIRE_VERSION:-1.15.2}
    hostname: spire-agent
    pid: "host"
    entrypoint: ["/opt/spire/bin/spire-agent", "run", "-config", "/etc/spire/agent/agent.conf", "-joinToken"]
    # kics-scan ignore-line
    command: ["${SPIRE_JOIN_TOKEN:-placeholder}"]
    depends_on:
      - spire-server
    volumes:
      - ./bin/spire/agent:/etc/spire/agent:ro
      - ${SPIFFE_TMPDIR:-/tmp/spiffe-tokens}:/run/spire/secrets
      - spire-agent-socket:/run/spire/sockets
    networks:
      - spiffe
    profiles:
      - spiffe

# The 'conjur' network exists solely for cert-auth (Enterprise appliance) tests.
# conjur-leader uses a fixed FQDN hostname (conjur-leader-1.mycompany.local) that
# must match the TLS cert baked in by 'evoke configure master'. Because that FQDN
# won't resolve on the default network, conjur-leader is placed here with a
# matching alias, and the test services join both networks.
# Without TEST_CERT=true this network is created but no service uses it.
#
# The 'spiffe' network connects the SPIRE server and agent. Without TEST_SPIFFE=true
# this network is created but no service uses it.
networks:
  conjur:
    driver: bridge
  spiffe:
    driver: bridge

volumes:
  # Shared between the SPIRE agent container and the test container (via docker run -v).
  # Provides the SPIFFE Workload API socket at /run/spire/sockets/agent.sock.
  spire-agent-socket:
