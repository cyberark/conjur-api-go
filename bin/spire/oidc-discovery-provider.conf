# SPIRE OIDC Discovery Provider configuration for integration testing.
#
# This provider connects to the SPIRE server admin socket and serves the JWKS
# endpoint over plain HTTP on port 8085 (insecure mode, for testing only).
# Conjur's authn-jwt jwks-uri variable is set to http://spire-oidc:8085/keys
# during setup-spiffe.sh.
#
# insecure_addr disables TLS so no certificate management is required for
# the integration test environment.

server_api {
    address = "unix:///run/spire/server/private/api.sock"
}

domains = ["spire-oidc"]

insecure_addr = ":8085"
