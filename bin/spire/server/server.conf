server {
    bind_address = "0.0.0.0"
    bind_port    = "8081"
    trust_domain = "conjur.test"
    data_dir     = "/tmp/spire/server/data"
    log_level    = "DEBUG"
    # Expose the admin API socket on a Docker-volume-mounted path so the
    # OIDC discovery provider sidecar can connect to it.
    socket_path  = "/run/spire/server/private/api.sock"
    # Set the JWT issuer so SPIRE embeds this URL as the `iss` claim in
    # JWT-SVIDs.  Conjur's authn-jwt validates the `iss` claim against the
    # `issuer` variable, so this must match SPIFFE_JWT_ISSUER_URL in
    # setup-spiffe.sh and the value stored in the authn-jwt issuer variable.
    jwt_issuer   = "http://spire-oidc:8085"

    # Use RSA-2048 keys for JWT-SVID signing (RS256 algorithm).
    # Conjur's Ruby JWT library expects RSA-signed tokens by default; ECDSA
    # (ES256, the SPIRE default) triggers a JWT::IncorrectAlgorithm error in
    # the version of Conjur used for integration tests.
    jwt_key_type = "rsa-2048"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type    = "sqlite3"
            connection_string = "/tmp/spire/server/datastore.sqlite3"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "memory" {
        plugin_data {}
    }
}
